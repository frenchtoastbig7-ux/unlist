id: peoplefinders
name: PeopleFinders
hosts:
- peoplefinders.com
category: people-search
contact:
  privacy_email: privacy@peoplefinders.com
search:
  method: url
  template: https://www.peoplefinders.com/people/{first}-{last}/{state}/{city}
  fetch: browser
opt_out:
  method: form
  url: https://www.peoplefinders.com/opt-out
  requires:
  - listing_url
  - email_link
  captcha: turnstile
sources:
- https://www.peoplefinders.com/opt-out
- https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List
notes: Cloudflare challenge before the page loads (seen 2026-11-04); a normal browser profile usually
  passes it, the tool waits for you.
