id: whitepages
name: Whitepages
hosts:
- whitepages.com
- 411.com
category: people-search
contact:
  privacy_url: https://www.whitepages.com/data-policy
search:
  method: url
  template: https://www.whitepages.com/name/{first}-{last}/{city}-{state}
  fetch: browser
  phone_template: https://www.411.com/phone/{phone_1dashed}
  notes: Reverse phone runs on the sister site 411.com; pattern read from its script on 2026-11-05.
  verified:
  - phone
opt_out:
  method: form
  url: https://www.whitepages.com/suppression-requests
  requires:
  - listing_url
  - phone_code
  captcha: none
  notes: Paste the listing URL; Whitepages places an automated phone call with a verification code to
    the number on the listing. The tool cannot answer that call.
  form:
    fields:
      listing_url: '#suppression-requests-person-url'
    stop_before: button:has-text('Next')
    notes: Selectors read from the live page on 2026-11-04.
last_verified: '2026-11-04'
sources:
- https://www.whitepages.com/suppression-requests
- https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List
