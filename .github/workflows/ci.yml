name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra extract --extra dev --extra app

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest (offline; browser tests are skipped)
        run: uv run pytest -q -m "not browser"

      - name: Verify CLI entry point
        run: uv run unlist --help
