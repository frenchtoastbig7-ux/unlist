id: familytreenow
name: FamilyTreeNow
hosts:
- familytreenow.com
category: people-search
search:
  method: url
  template: https://www.familytreenow.com/search/genealogy/results?first={first}&last={last}&citystatezip={city}%2C%20{state}
  fetch: browser
opt_out:
  method: form
  url: https://www.familytreenow.com/optout
  requires:
  - listing_url
  captcha: turnstile
sources:
- https://www.familytreenow.com/optout
- https://github.com/thumpersecure/opt-out-manual-2026
notes: Cloudflare challenge before the page loads (seen 2026-11-04); a normal browser profile usually
  passes it, the tool waits for you.
