id: cyberbackgroundchecks
name: CyberBackgroundChecks
hosts:
- cyberbackgroundchecks.com
category: people-search
search:
  method: url
  template: https://www.cyberbackgroundchecks.com/people/{first}-{last}/{state}/{city}
  fetch: browser
  phone_template: https://www.cyberbackgroundchecks.com/phone/{phone_dashed}
  notes: Phone pattern is the commonly documented one; the site blocked verification.
opt_out:
  method: form
  url: https://www.cyberbackgroundchecks.com/removal
  requires:
  - listing_url
  - email_link
  captcha: turnstile
sources:
- https://www.cyberbackgroundchecks.com/removal
- https://github.com/thumpersecure/opt-out-manual-2026
notes: Cloudflare challenge before the page loads (seen 2026-11-04); a normal browser profile usually
  passes it, the tool waits for you.
