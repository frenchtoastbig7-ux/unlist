id: fastpeoplesearch
name: FastPeopleSearch
hosts:
- fastpeoplesearch.com
category: people-search
search:
  method: url
  template: https://www.fastpeoplesearch.com/name/{first}-{last}_{city}-{state}
  fetch: browser
  phone_template: https://www.fastpeoplesearch.com/{phone_dashed}
  address_template: https://www.fastpeoplesearch.com/address/{street_slug}_{city_slug}-{state_lower}
  notes: Phone and address patterns read from the site's own script on 2026-11-05.
  verified:
  - address
  - phone
opt_out:
  method: form
  url: https://www.fastpeoplesearch.com/removal
  requires:
  - listing_url
  - email_link
  captcha: turnstile
sources:
- https://www.fastpeoplesearch.com/removal
- https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List
notes: Cloudflare challenge before the page loads (seen 2026-11-04); a normal browser profile usually
  passes it, the tool waits for you.
