id: nuwber
name: Nuwber
hosts:
- nuwber.com
category: people-search
search:
  method: url
  template: https://nuwber.com/search?name={first}%20{last}
  fetch: browser
  phone_template: https://nuwber.com/phone/{phone}
  notes: Phone pattern is the commonly documented one; the site blocked verification.
opt_out:
  method: form
  url: https://nuwber.com/removal/link
  requires:
  - listing_url
  - email_link
  captcha: unknown
notes: Removed from BADBOOL on 2026-10-31 (reason not stated); check the site still operates. Blocked
  the Claude built-in browser outright on 2026-11-04 (Cloudflare access denied); open it from your usual
  browser if the tool's Chromium is blocked too.
sources:
- https://nuwber.com/removal/link
- https://github.com/thumpersecure/opt-out-manual-2026
