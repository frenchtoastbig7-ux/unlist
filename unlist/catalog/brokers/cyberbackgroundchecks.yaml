id: cyberbackgroundchecks
name: CyberBackgroundChecks
hosts: [cyberbackgroundchecks.com]
category: people-search
search:
  method: url
  template: "https://www.cyberbackgroundchecks.com/people/{first}-{last}/{state}/{city}"
  fetch: browser
opt_out:
  method: form
  url: https://www.cyberbackgroundchecks.com/removal
  requires: [listing_url, email_link]
  captcha: unknown
sources:
  - https://www.cyberbackgroundchecks.com/removal
  - https://github.com/thumpersecure/opt-out-manual-2026
