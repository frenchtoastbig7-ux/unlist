[project]
name = "unlist"
version = "0.1.0"
description = "Local personal-data exposure monitor and removal tool: find your own listings on data brokers and in breach databases, drive opt-out requests, keep evidence, watch for reappearance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sovereign Edge Inc." }]
keywords = ["privacy", "data-broker", "opt-out", "ccpa", "gdpr", "breach-monitoring", "mcp"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "lxml>=5.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
extract = ["trafilatura>=1.12", "readability-lxml>=0.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/frenchtoastbig7-ux/unlist"

[project.scripts]
unlist = "unlist.cli:main"
unlist-mcp = "unlist.mcp.server:main"
unlist-app = "unlist.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unlist"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF012"]
per-file-ignores = { "tests/**" = ["E501"], "unlist/mcp/**" = ["E501"], "unlist/requests/inbox.py" = ["E501"], "unlist/requests/drop.py" = ["E501"], "unlist/app/**" = ["E501", "B008"], "unlist/reports/score.py" = ["E501"], "unlist/reports/exposure.py" = ["E501"], "unlist/requests/accounts.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = ["browser: needs a real browser (Playwright); skipped in CI"]
