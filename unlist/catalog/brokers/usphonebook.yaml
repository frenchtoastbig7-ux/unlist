id: usphonebook
name: USPhoneBook
hosts:
- usphonebook.com
category: people-search
search:
  method: url
  template: https://www.usphonebook.com/{first}-{last}
  fetch: browser
opt_out:
  method: form
  url: https://www.usphonebook.com/opt-out
  requires:
  - listing_url
  - email_link
  captcha: turnstile
sources:
- https://www.usphonebook.com/opt-out
- https://github.com/thumpersecure/opt-out-manual-2026
notes: Cloudflare challenge before the page loads (seen 2026-11-04); a normal browser profile usually
  passes it, the tool waits for you.
